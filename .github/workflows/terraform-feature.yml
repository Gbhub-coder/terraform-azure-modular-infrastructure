name: Terraform Feature CI

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform Init Plan Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Enviroment/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: b5fe651b-5b36-4b10-8b34-27cae7ca6cd0
          tenant-id: 5caf4764-d55b-4868-9fa5-d181786d439c
          subscription-id: 56afd0d4-bb58-4828-a131-b3a96400cb01

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -var-file="./terraform.tfvars"

      - name: Terraform Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: Enviroment/prod